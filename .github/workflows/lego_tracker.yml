name: LEGO Poland & EU Price Tracker

on:
  workflow_dispatch:
    inputs:
      check_retirement:
        description: "Also check retirement dates on Brickset/BrickEconomy/Promoklocki"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: lego-tracker-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-lego-deals:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite database & run logs from orphan state branch (if exists)
        run: |
          mkdir -p data
          git fetch origin db-state:db-state 2>/dev/null || true
          git checkout db-state -- data/lego_tracker.db data/scraper_runs.log 2>/dev/null || true

      - name: Run 24/7 Telegram Bot Server + 5-Minute Scheduled Price Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEFAULT_SUBSCRIPTIONS: ${{ secrets.DEFAULT_SUBSCRIPTIONS }}
          PROXY_URLS: ${{ secrets.PROXY_URLS }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
        run: |
          if [ "${{ inputs.check_retirement }}" = "true" ]; then
            python -m bot.main --daemon-minutes 13 --sync-git-db --check-retirement
          else
            python -m bot.main --daemon-minutes 13 --sync-git-db
          fi

      - name: Persist SQLite database & run logs to dedicated `db-state` branch
        if: always()
        run: |
          if [ -f data/lego_tracker.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan temp-db-state
            git rm -rf --cached . >/dev/null 2>&1 || true
            git add -f data/lego_tracker.db
            if [ -f data/scraper_runs.log ]; then
              git add -f data/scraper_runs.log
            fi
            git commit -m "Update LEGO tracker SQLite state and run logs" || true
            git branch -M temp-db-state db-state
            git push -f origin db-state
          fi
